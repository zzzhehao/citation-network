 and oceanic systems. Here, we used stable isotope (\u03b413C, \u03b415N) analysis, complemented by stomach content analysis, to examine cross-habitat resource use of predatory fishes across reef and near-reef oceanic ecosystems in Palau, in the Western Pacific, evaluating patterns across species, trophic guilds, and habitat associations. Cluster analyses, isotopic niche metrics, and Bayesian stable isotope mixing models revealed asymmetric but bidirectional connectivity, with resource utilization typically spanning both habitats but skewed towards reef or oceanic depending on species groups. Reef predators showed greater variability in resource use and higher reliance on oceanic inputs than oceanic predators relied on reef resources, with broad isotopic niches consistent with mobility, water-column use, and generalist foraging strategies. In contrast, most oceanic predators largely specialized on oceanic prey, although stomach contents documenting larval and juvenile reef fishes indicate occasional incorporation of reef-origin resources. Our results highlight the disproportionate importance of oceanic production in supporting reef predator populations, particularly where physical forcing concentrates prey near reef margins. Although reef contributions to oceanic predator diets were comparatively small, even limited inputs may be ecologically meaningful for migratory species during critical life stages. Together, these findings demonstrate widespread but trait-structured and individually variable predator-mediated connectivity that challenges binary \"reef\" versus \"oceanic\" classifications. Incorporating trophic connectivity into fisheries management and marine spatial planning can better align protection with the energetic pathways and habitat utilization sustaining predators in reef-ocean systems."}, {"id": "10.1016/j.csr.2026.105769", "title": "Trophic niche structure of a sea urchin assemblage...", "size": 10, "citations": 0, "importance": 9.35, "imp_color_val": 0.19623655913978488, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["C. D. Da Silva", "Renato Hajenius Ach\u00e9 de Freitas"], "journal": "Continental Shelf Research", "fullTitle": "Trophic niche structure of a sea urchin assemblage in southeastern Brazil", "is_secondary": false, "is_core": false, "abstract": "No abstract available."}, {"id": "10.1002/ecog.08252", "title": "Dietary partitioning mediates species coexistence ...", "size": 10, "citations": 0, "importance": 9.174999999999999, "imp_color_val": 0.17741935483870955, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["Na Zang", "Bi-Lin Liu"], "journal": "Ecography", "fullTitle": "Dietary partitioning mediates species coexistence in the high seas area of northwest Pacific", "is_secondary": false, "is_core": false, "abstract": "Niche partitioning, manifesting along various axes of the ecological niche, is a fundamental mechanism mediating species coexistence in a system. However, the emergence of many species in marine ecosystems would face considerable constraints in achieving coexistence through spatiotemporal differentiation mechanisms under the framework of niche partitioning. Consequently, dietary specialization may be the key mechanism to mediate coexistence, but lacks empirical support, especially for the oceanic system exhibiting heterogeneity and phenological variability in resource availability. We herein used data from nine pelagic species (five fish and four squid) sampled from the high seas area of the northwest Pacific during the summer season, when they migrate there to optimize foraging efficiency and growth, and evaluated their niche partitioning in terms of dietary specialization. We measured the bulk carbon and nitrogen stable isotopes and essential fatty acids of the nine species to estimate the isotopic and nutritional niche spaces, and employed Hutchinson's n\u2010dimensional hypervolume framework to examine the degree of dietary specialization. Results revealed that pairwise overlap of isotopic niches was observed for all species, though some species occupied distinct isotopic niche spaces. In contrast, the nutritional niche space, estimated using essential fatty acids, was mostly separate for each species, coupled with small or zero overlap between paired species. Furthermore, the specialization index, estimated using either stable isotopes or essential fatty acids, was consistently large for the nine species, while nestedness was relatively low. These findings reveal that the nine species partition their nutritional niche spaces to mitigate the competition caused by dietary niche overlaps, coinciding with the mechanism of dietary specialization."}, {"id": "10.1002/jez.70122", "title": "The Single, the Whole, and the Pooled: Implication...", "size": 10, "citations": 0, "importance": 8.325000000000001, "imp_color_val": 0.08602150537634418, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["P. Balzani", "Nad\u00e8ge B\u00e9louard"], "journal": "Journal of Experimental Zoology Part A Ecological and Integrative Physiology", "fullTitle": "The Single, the Whole, and the Pooled: Implications of Tissue Choice for Stable Isotope Analysis", "is_secondary": false, "is_core": false, "abstract": "ABSTRACT In the exciting era of non\u2010invasive tissue sampling and data reuse via open access databases, it is increasingly challenging to ensure comparability of sample types for stable isotope analysis in ecology. According to the theoretical predictions about the changes in the stable isotope values between prey and consumers and tissue turnover rates, the ecological question alone should dictate the choice of the sample type used (single tissue, whole body, or pooled samples). However, the sample types have also been constrained by the body size, availability, or legal status of the study species, and stable isotope data sets are routinely obtained from a variety of sample types. While there is a general agreement that this practice may bias the ecological conclusions of stable isotope studies, the risks incurred have seldom been reviewed explicitly, let alone quantified. With both ethical aspects and open science opportunities arising in the field, the issues around sample types in stable isotope ecology must be tackled explicitly. We illustrate how comparing stable isotope values from different sample types affects niche analyses and diet reconstructions, and detail the consequences of pooling samples on stable isotope variance. We call for (1) a thorough consideration of the adequation between sample types and ecological questions, including in data harvesting from global databases, and (2) for the development of methodological studies around sample type issues and that of a systematic framework that incorporates the known variations between sample types in statistical analyses."}, {"id": "10.1111/1749-4877.70144", "title": "Spatial Patterns of Avian Stable Isotopes Reveal E...", "size": 10, "citations": 0, "importance": 9.275, "imp_color_val": 0.18817204301075272, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["Yao-Hong Jia", "Chao Zhang"], "journal": "Integrative Zoology", "fullTitle": "Spatial Patterns of Avian Stable Isotopes Reveal Ecological Impacts of Climate and Land-Use Change.", "is_secondary": false, "is_core": false, "abstract": "Stable isotope analysis provides an integrated approach to tracing animal dietary sources and trophic structures while being sensitive to environmental and land-use changes. It therefore serves as a powerful tool for evaluating the interactions between animal resource use and environmental variation. However, spatial isotopic patterns across large numbers of species and their responses to climate change and anthropogenic activities remain poorly understood. Here, we applied a Bayesian mixed-effects modeling framework and isotopic niche analyses using feather samples from 766 individuals of 200 bird species in southwestern China (1958-2007) to assess how ecological, climatic, and anthropogenic factors jointly shaped the spatial patterns of feather carbon (\u03b41 3C) and nitrogen (\u03b41 5N) isotopes across taxa. The results revealed that the \u03b41 3C and \u03b41 5N values differed markedly across dietary and migratory guilds, highlighting distinct strategies of resource use and trophic organization among species. The feather \u03b41 5N values increased with increasing pasture coverage, suggesting a potential elevation of the baseline \u03b41 5N in grazing landscapes. \u03b41 5N also showed a positive trend with precipitation, indicating that wetter environments may be associated with elevated nitrogen isotopic baselines. Furthermore, isotopic niche analyses revealed that farmland habitats exhibited broader isotopic niches than forest habitats, especially for herbivores, highlighting the influence of agricultural expansion on resource use. Overall, this study demonstrates how ecological traits, climatic factors, and human disturbances jointly shape avian trophic patterns across taxa and scales, providing new insights into trophic structure and the consequences of land use change for ecosystem function across diverse ecosystems."}, {"id": "10.1002/ecs2.70678", "title": "Individual specialization and temporal changes in ...", "size": 10, "citations": 0, "importance": 10.925, "imp_color_val": 0.36559139784946243, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["No\u00e9mie Friscourt", "A. Walters"], "journal": "Ecosphere", "fullTitle": "Individual specialization and temporal changes in Antarctic fur seal trophic ecology from a multi\u2010tracer approach", "is_secondary": false, "is_core": false, "abstract": "Substantial individual variation in diet and foraging strategies can exist within populations. These differences can enhance individual foraging efficiency, reduce intraspecific competition, and provide fitness advantages that increase the resilience of a population. Understanding the extent and stability of individual variation, and its contribution to population niche dynamics, is therefore important for interpreting ecological responses, particularly under changing environmental conditions. We used bulk and compound\u2010specific stable isotope analyses together with tracking data to assess individual\u2010 and population\u2010level variation in the foraging strategies of adult female Antarctic fur seals ( Arctocephalus gazella ) from Marion Island (southern Indian Ocean), during the winter migration period, over a decade (2008\u20132018). We aimed to (1) determine the existence and degree of individual specialization within the population, (2) identify foraging strategies and assess potential influences of body size, and (3) evaluate the temporal stability of foraging strategies, trophic position, and the population isotopic niche, considering potential changes in isotopic baselines. Isotopic data from 129 whiskers from 80 individuals revealed four main foraging strategies, with individuals ranging from extreme specialists to generalists. Corresponding tracking data highlighted differences in the use of oceanographic features niches among these groups, notably in the time spent south or north of the Polar Front. Observed foraging patterns were not explained by body size but instead likely reflect a combination of intrinsic (e.g., energetic costs, experience, genetic legacy) and extrinsic factors (e.g., intra\u2010 and interspecific competition and environmental variability). Interannual fluctuations in the population's isotopic niche were also detected, potentially linked to changes in environmental conditions, highlighting the population's adaptability to ecosystem changes. Foraging strategies appear to be temporally stable, as 61% of the 31 females sampled over multiple years showed fidelity to foraging areas, and 74% in their resource use. This suggests that while the population exhibits adaptability to environmental variability, individual seals may consistently employ specific foraging behaviors to limit the potential costs of shifting foraging area and diet. Given the accelerating impacts of climate change on the Southern Ocean, this study underscores the value of stable isotope analysis of whiskers as a powerful, minimally invasive tool for long\u2010term ecological monitoring."}, {"id": "10.1007/s10641-026-01856-2", "title": "Ontogenetic shape variations are related to diet i...", "size": 10, "citations": 0, "importance": 18.0, "imp_color_val": 1.1263440860215055, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["Pablo Fajardo", "Carmen Barrios-Guzm\u00e1n"], "journal": "Environmental Biology of Fishes", "fullTitle": "Ontogenetic shape variations are related to diet in the drunk blenny Scartichthys variolatus (Blenniidae) from an oceanic island of South Pacific Ocean", "is_secondary": true, "is_core": true, "abstract": "No abstract available."}, {"id": "10.1016/j.fooweb.2025.e00429", "title": "The isotopic niche breadth of aquatic insects incr...", "size": 10, "citations": 0, "importance": 9.275, "imp_color_val": 0.18817204301075272, "year_color_val": 0.9629629629629629, "year": 2026, "authors": ["D. Castro", "Robert M. Hughes"], "journal": "Food Webs", "fullTitle": "The isotopic niche breadth of aquatic insects increases with elevation in neotropical mountain streams", "is_secondary": false, "is_core": false, "abstract": "No abstract available."}];

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
                URL.revokeObjectURL(url);
            }

            function escapeCSV(val) {
                if (val === null || val === undefined) return '""';
                const str = String(val);
                if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                    return `"${str.replace(/"/g, '""')}"`;
                }
                return str;

                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance === 0) return d.target.x;
                    return d.source.x + dx * (distance - d.target.size) / distance;
                })
                .attr('y2', d => {
                    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance === 0) return d.target.y;
                    return d.source.y + dy * (distance - d.target.size) / distance;
                });
            node.attr('cx', d => d.x).attr('cy', d => d.y);
        });

        function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
        function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

        function showInfo(d) {
            document.getElementById('sidebar-placeholder').style.display = 'none';
            document.getElementById('title').textContent = d.fullTitle;
            document.getElementById('authors').textContent = d.authors.join(', ') || 'Unknown';
            document.getElementById('year').textContent = d.year;
            document.getElementById('journal').textContent = d.journal;
            document.getElementById('abstract').textContent = d.abstract || 'No abstract available.';
            document.getElementById('citations').textContent = d.citations;
            document.getElementById('importance').textContent = d.importance === 999 ? 'SEED' : d.importance.toFixed(2);
            let roleText = 'Peripheral';
            if (d.importance === 999) roleText = 'Core (Initial)';
            else if (d.is_secondary) roleText = 'Core (Secondary)';
            document.getElementById('role').textContent = roleText;
            const doiLink = document.getElementById('doi-link');
            doiLink.href = `https://doi.org/${d.id}`; doiLink.textContent = d.id;
            document.getElementById('info').classList.add('active');

            // Update Add to List button state
            currentSelectedNode = d;
            btnAdd.disabled = false;
            if (userList.has(d.id)) {
                btnAdd.textContent = 'Remove from List';
                btnAdd.style.borderColor = '#eb4a40';
            } else {
                btnAdd.textContent = 'Add Selected Paper';
                btnAdd.style.borderColor = '#30363d';
            }
        }
    </script>
</body>

</html>
