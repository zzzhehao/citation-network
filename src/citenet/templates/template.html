<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citation Network</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            overflow: hidden;
        }

        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
        }

        /* Left Sidebar */
        #left-sidebar {
            width: 320px;
            background: #161b22;
            border-right: 1px solid #30363d;
            z-index: 20;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .left-list-header {
            padding: 14px 16px;
            border-bottom: 1px solid #30363d;
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        #paper-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .paper-list-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 8px 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s;
        }

        .paper-list-item:hover {
            border-color: #79c0ff;
        }

        .paper-list-item.active {
            border-color: #ffffff;
            background: #1c2430;
        }

        .paper-dot {
            width: 10px;
            height: 10px;
            min-width: 10px;
            min-height: 10px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);
            margin-top: 4px;
            transition: background-color 0.2s;
        }

        .paper-item-body {
            flex: 1;
            min-width: 0;
        }

        .paper-item-title {
            font-size: 12px;
            font-weight: 600;
            color: #e6edf3;
            line-height: 1.3;
            margin-bottom: 3px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .paper-item-authors {
            font-size: 11px;
            color: #8b949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 2px;
        }

        .paper-item-meta {
            font-size: 10px;
            color: #79c0ff;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        #left-bottom-panel {
            border-top: 1px solid #30363d;
            background: #161b22;
            padding: 12px 16px 14px;
            flex-shrink: 0;
        }

        #network {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        /* Right Sidebar */
        #sidebar {
            width: 310px;
            background: #161b22;
            border-left: 1px solid #30363d;
            padding: 20px 15px 20px 20px;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.3);
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        #info-container {
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            padding-right: 5px;
        }

        #info {
            display: none;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #30363d;
            flex-shrink: 0;
        }

        #info.active {
            display: block;
        }

        .paper-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .paper-meta {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
        }

        .meta-row {
            margin-bottom: 6px;
        }

        .meta-label {
            font-weight: 600;
            display: inline-block;
            width: 80px;
        }

        .meta-value {
            color: #79c0ff;
        }

        .doi-link {
            color: #79c0ff;
            text-decoration: none;
            word-break: break-all;
            font-size: 11px;
        }

        .doi-link:hover {
            text-decoration: underline;
        }

        .control-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select {
            background: #0d1117;
            color: #e6edf3;
            border: 1px solid #30363d;
            padding: 6px;
            width: 100%;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        select:hover {
            border-color: #79c0ff;
        }

        .color-scale {
            padding-top: 10px;
            border-top: 1px solid #30363d;
        }

        .scale-label {
            font-size: 11px;
            color: #8b949e;
            margin-bottom: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
        }

        .legend-color {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            margin-right: 6px;
            border: 1px solid #30363d;
        }

        .legend-text {
            font-size: 11px;
            color: #e6edf3;
        }

        .scale-bar {
            height: 12px;
            background: linear-gradient(to left, #D1EEEAFF, #A8DBD9FF, #85C4C9FF, #68ABB8FF, #4F90A6FF, #3B738FFF, #2A5674FF);
            border-radius: 3px;
            margin-bottom: 4px;
            margin-top: 6px;
        }

        .scale-text {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #8b949e;
        }

        /* Stats Panel */
        .stats-panel {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            border-top: 1px solid #30363d;
            padding-top: 15px;
            padding-bottom: 15px;
            min-height: 40px;
        }

        .stats-header {
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .stats-header:hover {
            color: #e6edf3;
        }

        .stats-content {
            margin-top: 15px;
            display: none;
            flex-direction: column;
            gap: 6px;
            padding-right: 5px;
        }

        .stats-content.active {
            display: flex;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .stat-label {
            color: #8b949e;
        }

        .stat-value {
            color: #e6edf3;
            font-weight: 500;
            text-align: right;
            max-width: 50%;
            word-break: break-word;
        }

        /* User List Panel */
        .user-list-panel {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .user-list-header {
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: #30363d;
            border-color: #8b949e;
            color: #ffffff;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.is-read {
            background: #2b313a;
            border-color: #8b949e;
            color: #ffffff;
        }

        .export-controls {
            display: flex;
            gap: 8px;
        }

        .export-controls select {
            flex: 2;
        }

        .export-controls .btn {
            flex: 1;
        }

        /* Saved List Items Display */
        .saved-list-container {
            margin-top: 15px;
            border-top: 1px solid #30363d;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .saved-list-header {
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .saved-list-header:hover {
            color: #e6edf3;
        }

        .saved-list-content {
            margin-top: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .saved-list-content.active {
            display: flex;
        }

        .saved-list-item {
            background: #0d1117;
            border: 1px solid #30363d;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .saved-list-item:hover {
            border-color: #79c0ff;
        }

        .saved-list-item-title {
            font-size: 11px;
            font-weight: 600;
            color: #e6edf3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .saved-list-item-meta {
            font-size: 10px;
            color: #8b949e;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #8b949e;
        }

        svg {
            background: #0d1117;
        }

        circle {
            cursor: pointer;
            transition: opacity 0.3s, filter 0.3s, fill 0.25s;
        }

        circle.saved-node {
            stroke: #1A7B59 !important;
            stroke-width: 2.5px !important;
        }

        circle:hover,
        circle.active-node {
            stroke: #ffffff !important;
            stroke-width: 2.5px !important;
            filter: brightness(1.2);
        }

        .tooltip {
            position: absolute;
            background: #161b22;
            padding: 8px 12px;
            border: 1px solid #30363d;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            display: none;
            z-index: 1000;
            max-width: 250px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .link-group {
            transition: opacity 0.3s;
        }

        line {
            stroke: #5c646c;
            stroke-opacity: 0.8;
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="left-sidebar">
            <div class="left-list-header">
                <span>Papers (<span id="paper-list-count">0</span>)</span>
                <span style="font-size: 10px; font-weight: 400;">Click to focus</span>
            </div>
            <div id="left-sort-bar"
                style="padding: 8px 12px; border-bottom: 1px solid #30363d; background: #161b22; flex-shrink: 0;">
                <label for="left-sort-select" style="margin-bottom: 4px; font-size: 10px;">Sort Papers By</label>
                <select id="left-sort-select">
                    <option value="score-desc" selected>Score (High to Low)</option>
                    <option value="score-asc">Score (Low to High)</option>
                    <option value="year-desc">Year (Newest to Oldest)</option>
                    <option value="year-asc">Year (Oldest to Newest)</option>
                    <option value="citations-desc">Citations (High to Low)</option>
                    <option value="citations-asc">Citations (Low to High)</option>
                </select>
            </div>
            <div id="paper-list"></div>

            <div id="left-bottom-panel">
                <div class="control-group">
                    <label for="color-mode">Peripheral Color Mapping</label>
                    <select id="color-mode">
                        <option value="importance" selected>Score (Default)</option>
                        <option value="year">Publication Year</option>
                    </select>
                </div>

                <div class="color-scale">
                    <div class="scale-label">Legend</div>
                    <div class="legend-row">
                        <div class="legend-item">
                            <div class="legend-color" style="background: #fcde9c;"></div>
                            <div class="legend-text">Initial Core</div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #eb4a40;"></div>
                            <div class="legend-text">Secondary Core</div>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color" style="background: #6e7681;"></div>
                            <div class="legend-text">Read</div>
                        </div>
                    </div>

                    <div class="scale-bar"></div>
                    <div class="scale-text">
                        <span id="legend-min">Lower Score</span>
                        <span id="legend-max">Higher Score</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="network"></div>

        <div id="sidebar">
            <div id="info-container">
                <div id="info">
                    <div class="paper-title" id="title"></div>
                    <div class="paper-meta">
                        <div class="meta-row"><span class="meta-label">Authors:</span><span id="authors"></span></div>
                        <div class="meta-row"><span class="meta-label">Year:</span><span class="meta-value"
                                id="year"></span></div>
                        <div class="meta-row"><span class="meta-label">Journal:</span><span id="journal"></span></div>
                        <div class="meta-row"><span class="meta-label">Citations:</span><span class="meta-value"
                                id="citations"></span></div>
                        <div class="meta-row"><span class="meta-label">Score:</span><span class="meta-value"
                                id="importance"></span></div>
                        <div class="meta-row"><span class="meta-label">Role:</span><span class="meta-value"
                                id="role"></span></div>
                        <div class="meta-row"><span class="meta-label">DOI:</span><a class="doi-link" id="doi-link"
                                target="_blank"></a></div>
                        <div class="meta-row">
                            <span class="meta-label" style="display: block; margin-bottom: 4px;">Abstract:</span>
                            <span class="meta-value" id="abstract"
                                style="display: block; font-size: 11px; color: #8b949e; line-height: 1.4; max-height: 200px; overflow-y: auto; text-align: justify;"></span>
                        </div>
                    </div>
                </div>

                <div id="sidebar-placeholder"
                    style="color: #8b949e; font-size: 13px; text-align: center; margin-top: 40px; padding: 20px;">
                    Click any node in the network or paper in the left list to view details here.
                </div>
            </div>

            <div class="user-list-panel">
                <div class="user-list-header">User Saved Papers (<span id="user-list-count">0</span>)</div>
                <button id="btn-mark-read" class="btn" disabled>Mark as Read</button>
                <button id="btn-add-list" class="btn" disabled>Add Selected Paper</button>

                <div class="export-controls">
                    <select id="export-format">
                        <option value="csv">Export as CSV</option>
                        <option value="bibtex">Export as BibTeX</option>
                        <option value="doi_txt">DOI only (.txt)</option>
                        <option value="doi_clipboard">DOI only (Clipboard)</option>
                        <option value="apa_txt">APA 7 (.txt)</option>
                        <option value="apa_clipboard">APA 7 (Clipboard)</option>
                    </select>
                    <button id="btn-export-list" class="btn">Export</button>
                </div>

                <div class="saved-list-container">
                    <div class="saved-list-header" id="saved-list-header">
                        <span>View Saved Papers</span>
                        <span id="saved-list-chevron">▼</span>
                    </div>
                    <div class="saved-list-content" id="saved-list-content"></div>
                </div>
            </div>

            <div class="stats-panel">
                <div class="stats-header" id="stats-header">
                    <span>Run Statistics</span>
                    <span id="stats-chevron">▼</span>
                </div>
                <div class="stats-content" id="stats-content"></div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        const nodes = __NODES_JSON__;
        const links = __LINKS_JSON__;
        const stats = __STATS_JSON__;

        const READ_COLOR = '#6e7681';
        const INITIAL_CORE_COLOR = '#fcde9c';
        const SECONDARY_CORE_COLOR = '#eb4a40';

        let currentColorMode = 'importance';
        const readPapers = new Set();
        const userList = new Map();
        let currentSelectedNode = null;

        const colorScale = d3.scaleLinear()
            .domain([1, 0.83, 0.66, 0.5, 0.33, 0.16, 0])
            .range(['#D1EEEAFF', '#A8DBD9FF', '#85C4C9FF', '#68ABB8FF', '#4F90A6FF', '#3B738FFF', '#2A5674FF']);

        function getNodeColor(d) {
            if (readPapers.has(d.id)) return READ_COLOR;
            if (d.importance === 999) return INITIAL_CORE_COLOR;
            if (d.is_secondary) return SECONDARY_CORE_COLOR;
            const val = currentColorMode === 'year' ? d.year_color_val : d.imp_color_val;
            return colorScale(val);
        }

        function formatCompactAuthors(authors) {
            if (!Array.isArray(authors) || authors.length === 0) return 'Unknown';
            if (authors.length === 1) return authors[0];
            if (authors.length === 2) return `${authors[0]} & ${authors[1]}`;
            return `${authors[0]} et al.`;
        }

        function formatScore(d) {
            return d.importance === 999 ? 'SEED' : Number(d.importance).toFixed(2);
        }

        // ------------------ STATS & LEFT PAPER LIST ------------------
        const statsContent = document.getElementById('stats-content');
        for (const [key, value] of Object.entries(stats)) {
            const row = document.createElement('div');
            row.className = 'stat-row';
            row.innerHTML = `<span class="stat-label">${key}</span><span class="stat-value">${value}</span>`;
            statsContent.appendChild(row);
        }

        const statsHeader = document.getElementById('stats-header');
        statsHeader.addEventListener('click', () => {
            statsContent.classList.toggle('active');
            document.getElementById('stats-chevron').textContent = statsContent.classList.contains('active') ? '▲' : '▼';
            if (statsContent.classList.contains('active')) {
                setTimeout(() => {
                    document.getElementById('sidebar').scrollTo({ top: document.getElementById('sidebar').scrollHeight, behavior: 'smooth' });
                }, 50);
            }
        });

        const paperListEl = document.getElementById('paper-list');
        document.getElementById('paper-list-count').textContent = nodes.length;
        const sortSelectEl = document.getElementById('left-sort-select');
        const listItemsById = new Map();

        function getSortedNodes(sortKey) {
            const copy = [...nodes];
            switch (sortKey) {
                case 'score-asc':
                    return copy.sort((a, b) => (a.importance - b.importance) || (b.year - a.year));
                case 'year-desc':
                    return copy.sort((a, b) => (b.year - a.year) || (b.importance - a.importance));
                case 'year-asc':
                    return copy.sort((a, b) => (a.year - b.year) || (b.importance - a.importance));
                case 'citations-desc':
                    return copy.sort((a, b) => (b.citations - a.citations) || (b.importance - a.importance));
                case 'citations-asc':
                    return copy.sort((a, b) => (a.citations - b.citations) || (b.importance - a.importance));
                case 'score-desc':
                default:
                    return copy.sort((a, b) => (b.importance - a.importance) || (b.year - a.year));
            }
        }

        function renderPaperList(sortKey = sortSelectEl.value) {
            paperListEl.innerHTML = '';
            listItemsById.clear();

            const ordered = getSortedNodes(sortKey);
            ordered.forEach(d => {
                const item = document.createElement('div');
                item.className = 'paper-list-item';
                if (currentSelectedNode && currentSelectedNode.id === d.id) {
                    item.classList.add('active');
                }
                item.dataset.id = d.id;

                const dot = document.createElement('span');
                dot.className = 'paper-dot';
                dot.style.backgroundColor = getNodeColor(d);

                const body = document.createElement('div');
                body.className = 'paper-item-body';
                body.innerHTML = `
        <div class="paper-item-title" title="${d.fullTitle.replace(/"/g, '&quot;')}">${d.fullTitle}</div>
        <div class="paper-item-authors">${formatCompactAuthors(d.authors)}</div>
        <div class="paper-item-meta">
            <span>${d.year}</span>
            <span>Score: ${formatScore(d)} | Cites: ${d.citations}</span>
        </div>
    `;

                item.appendChild(dot);
                item.appendChild(body);
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectNode(d);
                });

                paperListEl.appendChild(item);
                listItemsById.set(d.id, { item, dot });
            });
        }

        sortSelectEl.addEventListener('change', (e) => {
            renderPaperList(e.target.value);
        });

        renderPaperList();

        function syncVisualStates() {
            d3.selectAll('circle')
                .attr('fill', d => getNodeColor(d))
                .classed('saved-node', d => userList.has(d.id))
                .classed('active-node', d => currentSelectedNode && currentSelectedNode.id === d.id);

            nodes.forEach(d => {
                const entry = listItemsById.get(d.id);
                if (!entry) return;
                entry.dot.style.backgroundColor = getNodeColor(d);
                entry.item.classList.toggle('active', Boolean(currentSelectedNode && currentSelectedNode.id === d.id));
            });

            updateActionButtons();
        }

        // ------------------ USER LIST & READ STATE ------------------
        const btnRead = document.getElementById('btn-mark-read');
        const btnAdd = document.getElementById('btn-add-list');
        const listCount = document.getElementById('user-list-count');
        const btnExport = document.getElementById('btn-export-list');

        const savedListHeader = document.getElementById('saved-list-header');
        const savedListContent = document.getElementById('saved-list-content');
        const savedListChevron = document.getElementById('saved-list-chevron');

        savedListHeader.addEventListener('click', () => {
            savedListContent.classList.toggle('active');
            savedListChevron.textContent = savedListContent.classList.contains('active') ? '▲' : '▼';
        });

        function updateActionButtons() {
            if (!currentSelectedNode) {
                btnRead.disabled = true;
                btnRead.textContent = 'Mark as Read';
                btnRead.classList.remove('is-read');

                btnAdd.disabled = true;
                btnAdd.textContent = 'Add Selected Paper';
                btnAdd.style.borderColor = '#30363d';
                return;
            }

            btnRead.disabled = false;
            if (readPapers.has(currentSelectedNode.id)) {
                btnRead.textContent = 'Marked as Read (Undo)';
                btnRead.classList.add('is-read');
            } else {
                btnRead.textContent = 'Mark as Read';
                btnRead.classList.remove('is-read');
            }

            btnAdd.disabled = false;
            if (userList.has(currentSelectedNode.id)) {
                btnAdd.textContent = 'Remove from List';
                btnAdd.style.borderColor = '#eb4a40';
            } else {
                btnAdd.textContent = 'Add Selected Paper';
                btnAdd.style.borderColor = '#30363d';
            }
        }

        btnRead.addEventListener('click', () => {
            if (!currentSelectedNode) return;
            if (readPapers.has(currentSelectedNode.id)) {
                readPapers.delete(currentSelectedNode.id);
            } else {
                readPapers.add(currentSelectedNode.id);
            }
            syncVisualStates();
        });

        function updateSavedListUI() {
            savedListContent.innerHTML = '';
            for (const d of userList.values()) {
                const item = document.createElement('div');
                item.className = 'saved-list-item';
                item.innerHTML = `
                    <div class="saved-list-item-title">${d.fullTitle}</div>
                    <div class="saved-list-item-meta">${d.year} | ${formatCompactAuthors(d.authors)}</div>
                `;
                item.addEventListener('click', (e) => {
                    e.stopPropagation();
                    selectNode(d);
                });
                savedListContent.appendChild(item);
            }
        }

        btnAdd.addEventListener('click', () => {
            if (!currentSelectedNode) return;
            if (userList.has(currentSelectedNode.id)) {
                userList.delete(currentSelectedNode.id);
            } else {
                userList.set(currentSelectedNode.id, currentSelectedNode);
            }
            listCount.textContent = userList.size;
            updateSavedListUI();
            syncVisualStates();
        });

        function downloadBlob(content, filename, contentType) {
            const blob = new Blob([content], { type: contentType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function escapeCSV(val) {
            if (val === null || val === undefined) return '""';
            const str = String(val);
            if (str.includes(',') || str.includes('"') || str.includes('\n')) {
                return `"${str.replace(/"/g, '""')}"`;
            }
            return str;
        }

        btnExport.addEventListener('click', () => {
            if (userList.size === 0) {
                alert('Your saved list is empty. Click a paper and add it first!');
                return;
            }

            const format = document.getElementById('export-format').value;
            const items = Array.from(userList.values());

            if (format === 'csv') {
                const header = "doi,title,authors,year,journal,citation_count,importance_score,role\n";
                const rows = items.map(d => {
                    let role = d.importance === 999 ? 'Core (Initial Seed)' : (d.is_secondary ? 'Core (Secondary)' : 'Peripheral');
                    return [d.id, d.fullTitle, (d.authors || []).join('; '), d.year, d.journal, d.citations, d.importance, role]
                        .map(escapeCSV).join(',');
                });
                downloadBlob(header + rows.join('\n'), 'citation_network_user_list.csv', 'text/csv');
            }
            else if (format === 'bibtex') {
                const content = items.map(d => {
                    const authorStr = (d.authors || []).join(' and ');
                    return `@article{${d.id},\n  title={${d.fullTitle}},\n  author={${authorStr}},\n  journal={${d.journal}},\n  year={${d.year}},\n  url={https://doi.org/${d.id}}\n}`;
                }).join('\n\n');
                downloadBlob(content, 'user_list.bib', 'text/plain');
            }
            else if (format === 'doi_txt' || format === 'doi_clipboard') {
                const content = items.map(d => d.id).join('\n');
                if (format === 'doi_txt') downloadBlob(content, 'user_list_dois.txt', 'text/plain');
                else navigator.clipboard.writeText(content).then(() => alert('DOIs copied to clipboard!'));
            }
            else if (format === 'apa_txt' || format === 'apa_clipboard') {
                const content = items.map(d => {
                    const authorStr = (d.authors || []).join(', ');
                    return `${authorStr} (${d.year}). ${d.fullTitle}. ${d.journal}. https://doi.org/${d.id}`;
                }).join('\n\n');
                if (format === 'apa_txt') downloadBlob(content, 'user_list_apa.txt', 'text/plain');
                else navigator.clipboard.writeText(content).then(() => alert('APA citations copied to clipboard!'));
            }
        });

        // ------------------ D3 VISUALIZATION ------------------
        const width = document.getElementById('network').clientWidth;
        const height = window.innerHeight;

        const svg = d3.select('#network').append('svg').attr('width', width).attr('height', height);
        const g = svg.append('g');

        svg.call(d3.zoom().scaleExtent([0.1, 4]).on('zoom', (e) => g.attr('transform', e.transform)));

        svg.append("defs").append("marker")
            .attr("id", "arrowhead").attr("viewBox", "-0 -5 10 10").attr("refX", 8).attr("refY", 0).attr("orient", "auto")
            .attr("markerWidth", 8).attr("markerHeight", 8).attr("xoverflow", "visible")
            .append("svg:path").attr("d", "M 0,-5 L 10 ,0 L 0,5").attr("fill", "#5c646c").style("stroke", "none");

        svg.append("defs").append("marker")
            .attr("id", "arrowhead-dimmed").attr("viewBox", "-0 -5 10 10").attr("refX", 8).attr("refY", 0).attr("orient", "auto")
            .attr("markerWidth", 8).attr("markerHeight", 8).attr("xoverflow", "visible")
            .append("svg:path").attr("d", "M 0,-5 L 10 ,0 L 0,5").attr("fill", "#5c646c").attr("fill-opacity", "0.05").style("stroke", "none");

        const maxWeight = Math.max(1, d3.max(links, d => d.weight) || 1);

        const simulation = d3.forceSimulation(nodes)
            .force('link', d3.forceLink(links).id(d => d.id)
                .distance(d => {
                    const norm = Math.log1p(d.weight) / Math.log1p(maxWeight);
                    return 80 - (norm * 60);
                })
                .strength(d => {
                    const norm = Math.log1p(d.weight) / Math.log1p(maxWeight);
                    return 0.05 + (norm * 0.25);
                })
            )
            .force('charge', d3.forceManyBody().strength(-500).distanceMax(400))
            .force('center', d3.forceCenter(width / 2, height / 2))
            .force('collision', d3.forceCollide().radius(d => d.size + 10));

        const linkGroup = g.selectAll('.link-group').data(links).enter().append('g').attr('class', 'link-group');
        const link = linkGroup.append('line').attr("marker-end", "url(#arrowhead)");

        function selectNode(d) {
            currentSelectedNode = d;
            showInfo(d);
            updateActionButtons();

            const connected = new Set([d.id]);
            linkGroup.style('opacity', l => {
                if (l.source.id === d.id || l.target.id === d.id) {
                    connected.add(l.source.id);
                    connected.add(l.target.id);
                    return 1.0;
                }
                return 0.05;
            });

            link.attr("marker-end", l => (l.source.id === d.id || l.target.id === d.id) ? "url(#arrowhead)" : "url(#arrowhead-dimmed)");
            node.style('opacity', n => connected.has(n.id) ? 1.0 : 0.1).classed('active-node', n => n.id === d.id);

            listItemsById.forEach((entry, id) => {
                const isSelected = id === d.id;
                entry.item.classList.toggle('active', isSelected);
                if (isSelected) {
                    entry.item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            });
        }

        const node = g.selectAll('circle').data(nodes).enter().append('circle')
            .attr('r', d => d.size)
            .attr('fill', d => getNodeColor(d))
            .attr('stroke', '#30363d').attr('stroke-width', 1)
            .call(d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended))
            .on('click', (event, d) => {
                event.stopPropagation();
                selectNode(d);
            })
            .on('mouseover', (event, d) => {
                const tooltip = document.getElementById('tooltip');
                tooltip.innerHTML = `<strong>${d.fullTitle.substring(0, 60)}${d.fullTitle.length > 60 ? '...' : ''}</strong><br><span style="color:#8b949e; font-size:10px;">Cites: ${d.citations} | Score: ${formatScore(d)} | Year: ${d.year}</span>`;
                tooltip.style.display = 'block';
                tooltip.style.left = event.pageX + 10 + 'px'; tooltip.style.top = event.pageY + 10 + 'px';
            })
            .on('mousemove', (e) => {
                const tooltip = document.getElementById('tooltip');
                tooltip.style.left = e.pageX + 10 + 'px'; tooltip.style.top = e.pageY + 10 + 'px';
            })
            .on('mouseout', () => document.getElementById('tooltip').style.display = 'none');

        document.getElementById('color-mode').addEventListener('change', function () {
            currentColorMode = this.value;
            const isYear = currentColorMode === 'year';

            node.transition().duration(500).attr('fill', d => getNodeColor(d));
            nodes.forEach(d => {
                const entry = listItemsById.get(d.id);
                if (entry) entry.dot.style.backgroundColor = getNodeColor(d);
            });

            document.getElementById('legend-min').textContent = isYear ? 'Oldest' : 'Lower Score';
            document.getElementById('legend-max').textContent = isYear ? 'Newest' : 'Higher Score';
        });

        svg.on('click', () => {
            document.getElementById('info').classList.remove('active');
            document.getElementById('sidebar-placeholder').style.display = 'block';
            node.style('opacity', 1.0).classed('active-node', false);
            linkGroup.style('opacity', 1.0);
            link.attr('marker-end', "url(#arrowhead)");

            currentSelectedNode = null;
            listItemsById.forEach(entry => entry.item.classList.remove('active'));
            updateActionButtons();
        });

        simulation.on('tick', () => {
            link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
                .attr('x2', d => {
                    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance === 0) return d.target.x;
                    return d.source.x + dx * (distance - d.target.size) / distance;
                })
                .attr('y2', d => {
                    const dx = d.target.x - d.source.x, dy = d.target.y - d.source.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance === 0) return d.target.y;
                    return d.source.y + dy * (distance - d.target.size) / distance;
                });
            node.attr('cx', d => d.x).attr('cy', d => d.y);
        });

        function dragstarted(event, d) { if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; }
        function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
        function dragended(event, d) { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }

        function showInfo(d) {
            document.getElementById('sidebar-placeholder').style.display = 'none';
            document.getElementById('title').textContent = d.fullTitle;
            document.getElementById('authors').textContent = (d.authors || []).join(', ') || 'Unknown';
            document.getElementById('year').textContent = d.year;
            document.getElementById('journal').textContent = d.journal;
            document.getElementById('abstract').textContent = d.abstract || 'No abstract available.';
            document.getElementById('citations').textContent = d.citations;
            document.getElementById('importance').textContent = formatScore(d);
            let roleText = 'Peripheral';
            if (d.importance === 999) roleText = 'Core (Initial)';
            else if (d.is_secondary) roleText = 'Core (Secondary)';
            document.getElementById('role').textContent = roleText;
            const doiLink = document.getElementById('doi-link');
            doiLink.href = `https://doi.org/${d.id}`; doiLink.textContent = d.id;
            document.getElementById('info').classList.add('active');
        }
    </script>
</body>

</html>
